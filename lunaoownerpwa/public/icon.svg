<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Background subtle radial grid -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(99,102,241,0.1)" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(56,189,248,0.08)" stroke-width="1" />

  <!-- Lunao Stylized Crescent -->
  <path d="M 276 136 C 180 136 128 206 128 280 C 128 356 186 406 270 406 C 330 406 376 370 398 322 C 342 344 266 332 230 286 C 196 242 208 178 266 142 C 270 140 273 138 276 136 Z" 
        fill="url(#crescentGrad)" filter="url(#softGlow)" />

  <!-- Precision Star / Core Beacon -->
  <polygon points="348,154 358,182 386,192 358,202 348,230 338,202 310,192 338,182" fill="url(#accentGlow)" />
</svg>
