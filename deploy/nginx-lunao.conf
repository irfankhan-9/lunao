# Nginx reverse proxy configuration for Lunao SaaS API
# Placed in /etc/nginx/conf.d/lunao.conf

# Upstream Node.js process (PM2 running tsx server.ts on port 8787)
upstream lunao_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.lunao.org lunao.org www.lunao.org api.lunao.app 51.21.181.63 _;

    # Client upload limits for photo/template uploads
    client_max_body_size 50M;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # API and pipeline endpoints
    location / {
        proxy_pass http://lunao_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streams (campaign runs take 1-3 minutes)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}
